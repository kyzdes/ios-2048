name: Game2048
options:
  bundleIdPrefix: com.manaurum
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  SWIFT_VERSION: "5.9"
targets:
  Game2048:
    type: application
    platform: iOS
    sources:
      - path: Game2048
    settings:
      base:
        INFOPLIST_FILE: Game2048/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.manaurum.game2048
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  Game2048Mac:
    type: application
    platform: macOS
    sources:
      - path: Game2048
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.manaurum.game2048.mac
        PRODUCT_NAME: Game2048Mac
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: "2048 Mac"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
